# Example assumes PostgreSQL is a pod in namespace ag-data with this label.
# Adapt selectors (or use an exact ipBlock) to the actual database destination.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thinkpixelag-migration-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thinkpixelag-migrate
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ag-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
