<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · ThinkPixelAG</title><link rel="stylesheet" href="/static/console.css"></head>
<body><aside><a class="brand" href="/">ThinkPixel<span>AG</span></a><p class="eyebrow">GOVERNANCE CONSOLE</p>{% if session %}<nav><a href="/">Overview</a><a href="/agents">Agents</a><a href="/runs">Runs</a></nav><div class="identity"><small>Tenant</small><code>{{ session.tenant }}</code><small>Operator</small><code>{{ session.subject }}</code><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="secondary">Sign out</button></form></div>{% endif %}</aside><main><header><p class="eyebrow">THINKPIXEL / ADMINISTRATION</p><h1>{{ title }}</h1></header>{% block content %}{% endblock %}<footer>AG authorizes every operation. Console sessions are temporary.</footer></main></body></html>
