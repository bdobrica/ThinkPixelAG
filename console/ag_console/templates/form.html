{% extends 'base.html' %}{% block content %}<p>{{ note }}</p><section><form method="post" action="/prepare/{{ action }}"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% for f in fields %}<label for="{{ f.name }}">{{ f.label }}</label>{% if f.kind == 'textarea' %}<textarea id="{{ f.name }}" name="{{ f.name }}" required>{{ f.value }}</textarea>{% elif f.kind == 'select' %}<select id="{{ f.name }}" name="{{ f.name }}">{% for value, label in f.options %}<option value="{{ value }}" {% if value == f.value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% else %}<input id="{{ f.name }}" name="{{ f.name }}" type="{{ f.kind }}" value="{{ f.value }}" {% if f.readonly %}readonly{% endif %} {% if not f.optional %}required{% endif %}>{% endif %}{% endfor %}<button>Review request</button></form></section>{% endblock %}
