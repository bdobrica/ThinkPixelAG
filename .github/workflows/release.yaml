name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Build independent multi-architecture images
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          CREATED="$(git show -s --format=%cI HEAD)"
          mkdir -p .cache/release-metadata
          for component in ag console; do
            context=.; repository="${IMAGE_REPOSITORY,,}"
            if [[ "$component" == console ]]; then context=console; repository+=-console; fi
            image="$repository:${GITHUB_REF_NAME}"
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --push \
              --build-arg VERSION="${GITHUB_REF_NAME}" --build-arg REVISION="${GITHUB_SHA}" --build-arg CREATED="$CREATED" \
              --tag "$image" --metadata-file ".cache/release-metadata/$component-metadata.json" "$context"
            digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' ".cache/release-metadata/$component-metadata.json")"
            docker buildx imagetools inspect "$repository@$digest" --raw > ".cache/release-metadata/$component-manifest.json"
            printf '%s\n' "$repository@$digest" > ".cache/release-metadata/$component-image.txt"
          done
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Install pinned Trivy
        run: |
          curl --fail --location --silent --show-error https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          echo '1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75  /tmp/trivy.tar.gz' | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - name: Generate release artifacts and enforce vulnerability threshold
        env:
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          for component in ag console; do
            image="$(cat ".cache/release-metadata/$component-image.txt")"
            artifact=thinkpixelag
            if [[ "$component" == console ]]; then artifact+=-console; fi
            for architecture in amd64 arm64; do
              digest="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); d=[x["digest"] for x in m["manifests"] if x["platform"].get("os")=="linux" and x["platform"].get("architecture")==sys.argv[2]]; assert len(d)==1; print(d[0])' ".cache/release-metadata/$component-manifest.json" "$architecture")"
              IMAGE="${image%@*}@$digest" COMPONENT="$component" ARCHITECTURE="$architecture" \
                OUTPUT_DIR="dist/$component-$architecture" bash scripts/release-artifacts.sh
              tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
                -czf "dist/$artifact-$VERSION-$architecture.tar.gz" -C "dist/$component-$architecture" .
            done
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
      - name: Attest artifact archives with GitHub OIDC
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3.0.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS .cache/release-metadata/*-manifest.json .cache/release-metadata/*-metadata.json --draft --generate-notes --verify-tag
