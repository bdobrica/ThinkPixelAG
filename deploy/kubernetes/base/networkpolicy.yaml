apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thinkpixelag-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thinkpixelag-api
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: thinkpixelag}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-system}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Add explicit ipBlock/namespace rules for PostgreSQL, OPA, IdP, telemetry,
    # evidence, managed signing, and optional Valkey in the environment overlay.
