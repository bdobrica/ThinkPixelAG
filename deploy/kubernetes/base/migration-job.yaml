apiVersion: batch/v1
kind: Job
metadata:
  name: thinkpixelag-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thinkpixelag-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: thinkpixelag
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/bdobrica/thinkpixelag@sha256:REPLACE_WITH_RELEASE_DIGEST
          command: [/thinkpixelag-migrate]
          envFrom:
            - secretRef: {name: thinkpixelag-migration}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
