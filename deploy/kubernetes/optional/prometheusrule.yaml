apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: thinkpixelag
spec:
  groups:
    - name: thinkpixelag.slo
      rules:
        - alert: ThinkPixelAGUnavailable
          expr: sum(rate(thinkpixelag_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(thinkpixelag_http_requests_total[5m])), 1) > 0.01
          for: 10m
          labels: {severity: critical, owner: thinkpixelag}
          annotations:
            summary: ThinkPixelAG error rate exceeds its availability budget
            runbook_url: https://github.com/bdobrica/ThinkPixelAG/blob/main/docs/operations/runbooks.md#service-or-database-outage
        - alert: ThinkPixelAGDatabaseUnavailable
          expr: thinkpixelag_database_healthy == 0
          for: 5m
          labels: {severity: critical, owner: thinkpixelag}
          annotations:
            summary: ThinkPixelAG cannot reach authoritative PostgreSQL
            runbook_url: https://github.com/bdobrica/ThinkPixelAG/blob/main/docs/operations/runbooks.md#service-or-database-outage
        - alert: ThinkPixelAGRevocationStale
          expr: thinkpixelag_revocation_fresh == 0 or thinkpixelag_revocation_age_seconds > 30
          for: 2m
          labels: {severity: critical, owner: thinkpixelag}
          annotations:
            summary: Revocation state is outside its freshness contract
            runbook_url: https://github.com/bdobrica/ThinkPixelAG/blob/main/docs/operations/runbooks.md#revocation-gap-or-staleness
        - alert: ThinkPixelAGLatencyHigh
          expr: histogram_quantile(0.99, sum by (le) (rate(thinkpixelag_http_request_duration_seconds_bucket[10m]))) > 0.75
          for: 15m
          labels: {severity: warning, owner: thinkpixelag}
          annotations:
            summary: API p99 exceeds the run-admission envelope
            runbook_url: https://github.com/bdobrica/ThinkPixelAG/blob/main/docs/operations/runbooks.md#latency-or-capacity
        - alert: ThinkPixelAGOutboxBacklog
          expr: thinkpixelag_outbox_oldest_seconds > 30
          for: 10m
          labels: {severity: warning, owner: thinkpixelag}
          annotations:
            summary: Transactional outbox publication is outside its p99 objective
            runbook_url: https://github.com/bdobrica/ThinkPixelAG/blob/main/docs/operations/runbooks.md#outbox-backlog
        - alert: ThinkPixelAGOutboxStalled
          expr: thinkpixelag_outbox_oldest_seconds > 300
          for: 5m
          labels: {severity: critical, owner: thinkpixelag}
          annotations:
            summary: Transactional outbox publication is stalled
            runbook_url: https://github.com/bdobrica/ThinkPixelAG/blob/main/docs/operations/runbooks.md#outbox-backlog
        - alert: ThinkPixelAGSettlementLag
          expr: thinkpixelag_resource_settlement_lag_seconds > 30
          for: 10m
          labels: {severity: warning, owner: thinkpixelag}
          annotations:
            summary: Terminal resource settlement is delayed
            runbook_url: https://github.com/bdobrica/ThinkPixelAG/blob/main/docs/operations/runbooks.md#latency-or-capacity
