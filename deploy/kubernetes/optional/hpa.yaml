apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: thinkpixelag
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: thinkpixelag}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
