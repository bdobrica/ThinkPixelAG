apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thinkpixelag-api
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: thinkpixelag-postgres}
      ports:
        - {protocol: TCP, port: 5432}
